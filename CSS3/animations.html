<!Doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animations</title>
    <style>
      body {
          background-color: red;
          color: aliceblue;
          animation-name: colorchange;
          animation-duration: 3s;
          animation-iteration-count: infinite;
      }

      h1 {
          animation-name: fadeIn;
          animation-duration: 10s;
          animation-delay: 3s;
          animation-timing-function: linear;
      }

      p{
        animation-name: slideIn;
        animation-duration: 6s;
        animation-timing-function: ease-in;
      }

       @keyframes colorchange {
          20% {background-color: red;}
          40% {background-color: white;}
          60% {background-color: aqua;}
          80% {background-color: green;}
          100% {background-color: yellow;}
       }

       @keyframes fadeIn {
          0% {
              opacity: 0;
          }
          100% {
              opacity: 1;
          }
       }

        @keyframes slideIn {
             0% {
                  transform: translateX(-100%);
                  opacity: 0;
             }
              100% {
                    transform: translateX(0);
                    opacity: 1;
              }
          }
    </style>
  </head>
  <body>
    <h1>Animations in CSS</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, voluptate. Doloribus, voluptate. Doloribus, voluptate. Doloribus, voluptate. Doloribus, voluptate. Doloribus, voluptate. Doloribus, voluptate. Doloribus
    </p>
  </body>
</html>
