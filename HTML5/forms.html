<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha form</title>
</head>
<body>
    <h2 style="text-align: center;">Captcha Form</h2>
    <center><form autocomplete="off">
        <br>
        <fieldset>
            <legend>Personal Information</legend>
        <br>
        <label for="captcha">Enter Captcha: </label>
        <input type="text" id="captcha" placeholder="Enter Captcha..." name="captcha"> 
        <br>
        <br>
        <label for="un">Username: </label>
        <input type="text" placeholder="Enter name..." id="un" name="username">
        <br>
        <br>
        <label>Email :</label>
        <input type="email" name="email">
        <br>
        <br>
        <label>Password: <span style="color: red;">*</span> </label>
        <input type="password" name="pwd">
        <br>
        <br>
        <label>Mobile :</label>
        <input type="tel">
        <br>
        <br>
        <label>Age :</label>
        <input type="number" min="1" max="150">
        <br>
        <br>
        <label>Date of Birth :</label>
        <input type="date">
        <br>
        </fieldset>
        <br>
        <br>
        <fieldset>
            <legend>General Information</legend>
        <br>
        <label>Date of Birth with time:</label>
        <input type="datetime-local">
        <br>
        <br>
        <label>Profile Url :</label>
        <input type="url">
        <br>
        <br>
        <label>other :</label>
        <input type="image" src="download.jpeg">
        <br>
        <br>
        <label>Upload PAN Card :</label>
        <input type="file" accept=".pdf, .jpeg, .jpg">
        <br>
        <br>
        <label>Rate out of 5 :</label>
        <input type="range" min="1" max="5" name="HTML Rating" value="0">
        <br>
        <br>
        <label><input type="checkbox" name="opt1" value="cash"> Cash</label>
        <label><input type="checkbox" name="opt2" value="upi"> UPI</label>
        <label><input type="checkbox" name="opt3" value="rpay"> RazorPay</label>
        <br>
        <br>
        <label> Gender : </label>
        <label><input type="radio" name="opt" value="male"> Male </label>
        <label><input type="radio" name="opt" value="Female"> FeMale </label>
        <br>
        <br>
        <label>You allowed :</label>
        <input type="hidden">
        <br>
        <br>
        <label for="tech">Choose the Tech Stack :</label>
        <select name="tech" id="tech" multiple>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="js">Javascript</option>
        </select>
        <br>
        </fieldset>
        <br>
        <label for="comments">Comments : </label>
        <textarea placeholder="Enter your message"></textarea>
        </textarea>
        <br>
        <br>
        <input type="submit"> &nbsp; &nbsp; &nbsp; &nbsp; 
        <button type="reset">Cancel</button>
        <br>
        <br>
    </form></center>
</body>
</html>
