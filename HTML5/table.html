<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>
<body>
    <table border="1" style="width: 90%;">
        <caption style="text-align: left;caption-side: bottom;">IPL Team Info</caption>
        <!-- 1st row -->
        <tr>
            <th>Sl/no</th>
            <th>Name</th>
            <th>Team</th>
        </tr>
        <!-- 2nd row -->
        <tr>
            <td>1</td>
            <td>Dhoni</td>
            <td>CSK</td>
        </tr>
        <!-- 3rd row -->
        <tr>
            <td>2</td>
            <td>ABD</td>
            <td>RCB</td>
        </tr>
        <!-- 4th row -->
        <tr>
            <td>3</td>
            <td>Virat</td>
            <td>RCB</td>
        </tr>
    </table>
</body>
</html>
